<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Flask</title>
    <link rel="stylesheet" href=""
    
    <!-- Todo el CSS integrado directamente en el archivo -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-green {
            background-color: #059669;
            color: #ffffff;
        }

        .btn-green:hover {
            background-color: #10b981;
        }

        .btn-blue {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-blue:hover {
            background-color: #3b82f6;
        }

        .divider {
            margin: 24px 0 16px;
            border-top: 1px solid #334155;
        }

        .footer-text {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Panel Central</span>
        <h1>Control de Usuarios</h1>
        <p class="subtitle">Ingresa los datos para probar las rutas dinámicas de Flask</p>

        <!-- Formulario interactivo que conecta con tus rutas -->
        <div class="form-group">
            <label for="inputName">Nombre del Usuario:</label>
            <input type="text" id="inputName" placeholder="Ej: Jeremy" value="Jeremy">
        </div>

        <div class="form-group">
            <label for="inputAge">Edad:</label>
            <input type="number" id="inputAge" placeholder="Ej: 22" value="22">
        </div>

        <div class="button-group">
            <!-- Botón para comprobar elegibilidad de votación (info2.html) -->
            <button type="button" onclick="irAInfo()" class="btn btn-green">
                <span>🗳️</span> Validar Edad y Voto (/info)
            </button>

            <!-- Botón para ver el saludo (user2.html) -->
            <button type="button" onclick="irAUsuario()" class="btn btn-blue">
                <span>👋</span> Ver Saludo (/user)
            </button>
        </div>

        <div class="divider"></div>
    </div>

    <script>
        function irAInfo() {
            const name = encodeURIComponent(document.getElementById('inputName').value.trim() || 'Usuario');
            const age = encodeURIComponent(document.getElementById('inputAge').value.trim() || '18');
            window.location.href = `/info/${name}/${age}`;
        }

        function irAUsuario() {
            const name = encodeURIComponent(document.getElementById('inputName').value.trim() || 'Usuario');
            window.location.href = `/user/${name}`;
        }
    </script>

</body>
</html>
